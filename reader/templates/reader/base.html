<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}Bible Teacher{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50">
    <nav class="bg-blue-600 text-white shadow-lg">
        <div class="container mx-auto px-4 py-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-8">
                    <a href="{% url 'reader:bible_reader' %}" class="text-xl font-bold">Bible Teacher</a>
                    <div class="hidden md:flex space-x-4">
                        <a href="{% url 'reader:bible_reader' %}" class="hover:text-blue-200">Bible Study</a>
                        <a href="{% url 'reader:sermon_list' %}" class="hover:text-blue-200">Sermons</a>
                        <a href="{% url 'reader:sermon_notes_list' %}" class="hover:text-blue-200">Sermon Notes</a>
                    </div>
                </div>
                <div>
                    <a href="/admin/" class="hover:text-blue-200">Admin</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 text-white mt-12 py-6">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2026 Bible Teacher. All rights reserved.</p>
        </div>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
